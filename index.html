<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HM Kidora – Kids Clothing</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--soft:#eaf6fd;--blue:#6ec6f0;--deep:#2a8fc4;--ink:#17384a;--mute:#5b7a8c;--card:#fff;--line:#d3ebf8;--red:#e8567a;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1b24;--soft:#162a38;--ink:#e6f3fa;--mute:#9bb8c9;--card:#14232e;--line:#234155;--deep:#74cbf3}}
:root[data-theme="dark"]{--bg:#0f1b24;--soft:#162a38;--ink:#e6f3fa;--mute:#9bb8c9;--card:#14232e;--line:#234155;--deep:#74cbf3}
*{box-sizing:border-box;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--ink);font-family:'Nunito',system-ui,sans-serif;line-height:1.5}
h1,h2,h3,.brand{font-family:'Fredoka',system-ui,sans-serif}
.banner{background:linear-gradient(90deg,var(--blue),var(--deep));color:#fff;text-align:center;padding:8px 12px;font-weight:700;font-size:14px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--bg);border-bottom:2px solid var(--line);display:flex;align-items:center;gap:16px;padding:10px 24px;flex-wrap:wrap}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav a{padding:8px 14px;border-radius:99px;color:var(--ink);text-decoration:none;font-weight:700;font-size:15px;cursor:pointer;white-space:nowrap}
nav a:hover{background:var(--soft)}nav a.on{background:var(--blue);color:#fff}
.badge{background:var(--red);color:#fff;border-radius:99px;font-size:11px;padding:1px 7px;margin-left:4px}
.search{flex:1;min-width:180px;max-width:360px;margin-left:auto;position:relative}
.search input{width:100%;padding:10px 16px 10px 38px;border-radius:99px;border:2px solid var(--line);background:var(--soft);color:var(--ink);font:inherit;outline:none}
.search input:focus{border-color:var(--blue)}
.search span{position:absolute;left:14px;top:9px}
.logo{width:120px;height:52px;border:2px dashed var(--blue);border-radius:12px;display:flex;align-items:center;justify-content:center;color:var(--deep);font-size:12px;text-align:center;font-weight:700;overflow:hidden}
.logo img{max-width:100%;max-height:100%}
main{max-width:1150px;margin:0 auto;padding:28px 24px 60px;min-height:70vh}
.hero{display:grid;grid-template-columns:1fr 1fr;gap:32px;align-items:center;background:var(--soft);border-radius:28px;padding:36px}
.hero h1{font-size:clamp(32px,5vw,52px);line-height:1.1;margin-bottom:12px}
.hero h1 em{color:var(--deep);font-style:normal}
.hero p{color:var(--mute);margin-bottom:20px;font-size:17px}
.ph{aspect-ratio:4/3;border:3px dashed var(--blue);border-radius:22px;display:flex;align-items:center;justify-content:center;text-align:center;color:var(--deep);font-weight:700;padding:16px;background:var(--bg);overflow:hidden}
.ph img{width:100%;height:100%;object-fit:cover;border-radius:18px}
.btn{display:inline-block;background:var(--deep);color:#fff;border:0;border-radius:99px;padding:12px 24px;font:700 15px 'Nunito',sans-serif;cursor:pointer;text-decoration:none}
.btn:hover{filter:brightness(1.1)}.btn.alt{background:var(--bg);color:var(--deep);border:2px solid var(--deep);margin-left:8px}
.sec{margin:44px 0 18px;display:flex;justify-content:space-between;align-items:end;gap:10px}
.sec h2{font-size:28px}.sec a{color:var(--deep);font-weight:700;cursor:pointer}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:28px}
.tile{border-radius:22px;padding:34px;cursor:pointer;color:var(--ink);transition:transform .2s}
.tile:hover{transform:translateY(-4px)}.tile h3{font-size:28px}
.t1{background:linear-gradient(135deg,#d9f0fc,#b7e2f7)}.t2{background:linear-gradient(135deg,#f2fbff,#cdeefc)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:20px}
.card{background:var(--card);border:2px solid var(--line);border-radius:20px;overflow:hidden;display:flex;flex-direction:column;transition:box-shadow .2s}
.card:hover{box-shadow:0 8px 24px rgba(42,143,196,.18)}
.img{aspect-ratio:1;background:var(--soft);display:flex;align-items:center;justify-content:center;font-size:72px;position:relative}
.img img{width:100%;height:100%;object-fit:cover}
.off{position:absolute;top:10px;left:10px;background:var(--red);color:#fff;font:600 13px 'Fredoka';padding:3px 10px;border-radius:99px}
.info{padding:14px;display:flex;flex-direction:column;gap:6px;flex:1}
.info h3{font-size:17px;font-weight:500}.info small{color:var(--mute)}
.price{font:600 18px 'Fredoka';color:var(--deep)}.price s{color:var(--mute);font-weight:400;font-size:14px;margin-left:6px}
.row{display:flex;gap:8px;margin-top:auto}
select{flex:1;padding:8px;border-radius:10px;border:2px solid var(--line);background:var(--bg);color:var(--ink);font:inherit}
.add{background:var(--blue);color:#fff;border:0;border-radius:10px;padding:8px 14px;font-weight:700;cursor:pointer}
.add:hover{background:var(--deep)}
h1.title{font-size:36px;margin-bottom:6px}.sub{color:var(--mute);margin-bottom:24px}
.perks{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-top:44px}
.perk{background:var(--soft);border-radius:18px;padding:20px;text-align:center}.perk b{display:block;font:500 18px 'Fredoka'}
.cart-item{display:flex;gap:16px;align-items:center;background:var(--card);border:2px solid var(--line);border-radius:18px;padding:12px;margin-bottom:12px}
.cart-item .img{width:80px;height:80px;font-size:38px;border-radius:12px;flex:none}
.cart-item .mid{flex:1}
.qty{display:flex;align-items:center;gap:8px}.qty button{width:30px;height:30px;border-radius:50%;border:2px solid var(--blue);background:var(--bg);color:var(--deep);font-weight:700;cursor:pointer}
.rm{background:none;border:0;color:var(--red);cursor:pointer;font-weight:700}
.total{background:var(--soft);border-radius:18px;padding:20px;margin-top:20px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px}
.total b{font:600 26px 'Fredoka';color:var(--deep)}
.empty{text-align:center;padding:60px 0;color:var(--mute)}
.contact{display:grid;grid-template-columns:1fr 1fr;gap:24px}
.box{background:var(--soft);border-radius:20px;padding:24px}
.box p{margin:10px 0}
input.f,textarea.f{width:100%;padding:11px 14px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;margin-bottom:10px;outline:none}
.f:focus{border-color:var(--blue)}

.banner-hero{background:var(--soft);border-radius:28px;padding:14px;text-align:center}
.bh-img{border-radius:20px;overflow:hidden;aspect-ratio:3/2;max-height:560px;width:100%;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--deep);font-weight:700}
.bh-img img{width:100%;height:100%;object-fit:cover;display:block}
.bh-cta{padding:22px 10px 12px}.bh-cta p{color:var(--mute);font-size:17px;margin-bottom:16px}
.bh-cta .btn{margin:4px}.bh-cta .btn.alt{margin-left:4px}
.quote{text-align:center;background:linear-gradient(135deg,var(--blue),var(--deep));color:#fff;border-radius:28px;padding:48px 24px}
.quote h1{font-size:clamp(26px,4.5vw,44px);font-weight:500;line-height:1.2}
.quote small{display:block;margin-top:10px;opacity:.9;font-size:15px}
.store{display:grid;grid-template-columns:1.2fr 1fr;gap:24px;margin-top:32px}
.store .box h2{font-size:28px;margin-bottom:10px}
.store p{color:var(--mute);font-size:17px}
.loc{background:var(--bg);border:2px dashed var(--blue);border-radius:16px;padding:18px;margin-top:16px;color:var(--ink)}
.stat{display:flex;flex-direction:column;justify-content:center;text-align:center;background:var(--soft);border-radius:20px;padding:24px}
.stat b{font:600 44px 'Fredoka';color:var(--deep)}
@media(max-width:760px){.store{grid-template-columns:1fr}}
footer{background:var(--soft);text-align:center;padding:24px;color:var(--mute);font-size:14px}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translate(-50%,100px);background:var(--deep);color:#fff;padding:12px 22px;border-radius:99px;font-weight:700;transition:transform .3s;z-index:20}
.toast.show{transform:translate(-50%,0)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:2px solid var(--line);background:var(--bg);color:var(--ink);border-radius:99px;padding:7px 12px;font:700 13px 'Nunito',sans-serif;cursor:pointer;min-height:36px}
.chip.on{background:var(--deep);border-color:var(--deep);color:#fff}
.sortbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;color:var(--mute);font-weight:700}
.sortbar select{flex:none;width:auto}
.add{width:100%;min-height:44px;font-size:15px}
.tabs{display:none}
.wa{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));width:54px;height:54px;border-radius:50%;background:#25d366;display:flex;align-items:center;justify-content:center;font-size:26px;box-shadow:0 4px 14px rgba(0,0,0,.25);z-index:15;cursor:pointer}
button,a,.tile{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
@media(max-width:760px){
body{padding-bottom:calc(72px + env(safe-area-inset-bottom,0px))}
.hero,.contact,.tiles{grid-template-columns:1fr}
header{padding:8px 12px;gap:8px}
.search{order:1;flex:1;min-width:0;max-width:none;margin:0}
.logo{order:2;width:84px;height:42px;margin:0}
nav{order:3;flex-basis:100%;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav a{padding:9px 14px;background:var(--soft)}nav a.on{background:var(--blue)}
main{padding:16px 12px 30px}
.grid{grid-template-columns:1fr 1fr;gap:12px}
.info{padding:10px;gap:5px}.info h3{font-size:15px}.info small{font-size:12px}.price{font-size:16px}
.img{font-size:56px}
.sec h2{font-size:22px}h1.title{font-size:28px}
.tile{padding:22px}.tile h3{font-size:22px}
.banner-hero{padding:8px;border-radius:22px}
.bh-cta .btn{display:block;margin:8px 0}
.cart-item{flex-wrap:wrap}.cart-item .mid{flex-basis:55%}
.qty button{width:40px;height:40px;font-size:18px}
.total{position:sticky;bottom:calc(76px + env(safe-area-inset-bottom,0px));border:2px solid var(--line);box-shadow:0 -4px 16px rgba(42,143,196,.2)}
.total .btn{width:100%;min-height:48px}
.wa{bottom:calc(84px + env(safe-area-inset-bottom,0px));right:12px;width:50px;height:50px}
.toast{bottom:calc(84px + env(safe-area-inset-bottom,0px))}
.tabs{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:14;background:var(--bg);border-top:2px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
.tabs a{flex:1;text-align:center;font-size:11px;font-weight:700;color:var(--mute);cursor:pointer;padding:4px 0;border-radius:12px}
.tabs a span{display:block;font-size:22px;position:relative;line-height:1.2}
.tabs a.on{color:var(--deep);background:var(--soft)}
.tabs em{position:absolute;top:-2px;right:calc(50% - 22px);background:var(--red);color:#fff;font-style:normal;font-size:10px;border-radius:99px;padding:0 5px}
.box{padding:18px}
.quote{padding:34px 16px;border-radius:22px}
}
</style>
</head>
<body>

  <nav id="nav"></nav>

</header>
<main id="view"></main>
<footer>© <span id="yr"></span> HM Kidora · Dressing little ones with love 💙</footer>

/* =====================================================================
   Code below – no need to edit
   ===================================================================== */
const $=s=>document.querySelector(s), view=$('#view');
const fin=p=>p.discount>0?Math.round(p.price*(1-p.discount/100)):p.price;
const money=n=>CONFIG.currency+n.toLocaleString('en-US');
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let cart=[];
try{cart=JSON.parse(localStorage.getItem('kidora_cart')||'[]')}catch(e){}
const save=()=>{try{localStorage.setItem('kidora_cart',JSON.stringify(cart))}catch(e){}};
const count=()=>cart.reduce((a,i)=>a+i.qty,0);

function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('show'),1800)}

function card(p){
  const img=p.image?`<img src="${p.image}" alt="${p.name}">`:p.emoji;
  return `<div class="card"><div class="img">${img}${p.discount?`<span class="off">${p.discount}% OFF</span>`:''}</div>
  <div class="info"><small>${p.cat==='winter'?'❄️ Winter':'☀️ Summer'}</small><h3>${p.name}</h3><small>${p.desc}</small>
  <div class="price">${money(fin(p))}${p.discount?`<s>${money(p.price)}</s>`:''}</div>
  <div class="chips" id="s${p.id}">${p.sizes.map((s,i)=>`<button class="chip${i?'':' on'}" onclick="pick(this)">${s}</button>`).join('')}</div><div class="row">
  <button class="add" onclick="addCart(${p.id})">Add to Cart 🛍️</button></div></div></div>`;
}
function pick(b){b.parentNode.querySelectorAll('.chip').forEach(x=>x.classList.remove('on'));b.classList.add('on')}
function addCart(id){
  const size=$('#s'+id+' .on').textContent, f=cart.find(i=>i.id===id&&i.size===size);
  f?f.qty++:cart.push({id,size,qty:1});save();nav();toast('Added to cart 🛍️');
}
function chg(i,d){cart[i].qty+=d;if(cart[i].qty<1)cart.splice(i,1);save();nav();pages.cart()}
function rm(i){cart.splice(i,1);save();nav();pages.cart()}

function tabs(){const cur=location.hash.slice(1)||'home';$('#tabs').innerHTML=[['home','🏠','Home'],['winter','❄️','Winter'],['summer','☀️','Summer'],['cart','🛍️','Cart'],['about','💙','About']].map(([k,i,t])=>`<a class="${cur===k?'on':''}" onclick="go('${k}')"><span>${i}${k==='cart'&&count()?`<em>${count()}</em>`:''}</span>${t}</a>`).join('')}
function nav(){tabs();
  const cur=(location.hash.slice(1)||'home');
  const L=[['home','Home'],['winter','Winter Collection'],['summer','Summer Collection'],['about','About Us'],['cart','Cart'],['contact','Contact']];
  $('#nav').innerHTML=L.map(([k,t])=>`<a class="${cur===k?'on':''}" onclick="go('${k}')">${t}${k==='cart'&&count()?`<span class="badge">${count()}</span>`:''}</a>`).join('');
}
function go(p){$('#q').value='';if(location.hash.slice(1)===p)route();else location.hash=p}

let sortBy='feat';
const sorted=a=>{a=a.slice();if(sortBy==='lo')a.sort((x,y)=>fin(x)-fin(y));else if(sortBy==='hi')a.sort((x,y)=>fin(y)-fin(x));else if(sortBy==='off')a.sort((x,y)=>y.discount-x.discount);return a};
const sortBar=cat=>`<div class="sortbar"><span>${PRODUCTS.filter(p=>p.cat===cat).length} items</span><select onchange="sortBy=this.value;pages['${cat}']()"><option value="feat"${sortBy==='feat'?' selected':''}>Sort: Featured</option><option value="off"${sortBy==='off'?' selected':''}>Biggest discount</option><option value="lo"${sortBy==='lo'?' selected':''}>Price: low to high</option><option value="hi"${sortBy==='hi'?' selected':''}>Price: high to low</option></select></div>`;
const collection=(cat,title,sub)=>{
  const items=sorted(PRODUCTS.filter(p=>p.cat===cat));
  view.innerHTML=`<h1 class="title">${title}</h1><p class="sub">${sub}</p>${sortBar(cat)}<div class="grid">${items.map(card).join('')||'<p class="empty">No products yet.</p>'}</div>`;
};
const pages={
  home(){
    const hero=CONFIG.heroImage?`<img src="${CONFIG.heroImage}" alt="HM Kidora – Your Child’s Comfort, Our Promise">`:'📸 HERO PICTURE HERE<br>(set heroImage in CONFIG)';
    const sale=PRODUCTS.filter(p=>p.discount>0).slice(0,4), fresh=PRODUCTS.slice(0,4);
    view.innerHTML=`<section class="banner-hero"><div class="bh-img">${hero}</div><div class="bh-cta"><p>Soft, comfy and adorable kids clothing for every season, made for play, made with love.</p>
    <a class="btn" onclick="go('winter')">Shop Winter ❄️</a><a class="btn alt" onclick="go('summer')">Shop Summer ☀️</a><a class="btn alt" onclick="go('about')">About Us 💙</a></div></section>
    <div class="tiles"><div class="tile t1" onclick="go('winter')"><h3>❄️ Winter Collection</h3><p>Cozy jackets, sweaters and more</p></div>
    <div class="tile t2" onclick="go('summer')"><h3>☀️ Summer Collection</h3><p>Light, breezy and bright</p></div></div>
    ${sale.length?`<div class="sec"><h2>🏷️ Special Offers</h2></div><div class="grid">${sale.map(card).join('')}</div>`:''}
    <div class="sec"><h2>✨ Featured</h2></div><div class="grid">${fresh.map(card).join('')}</div>
    <div class="perks"><div class="perk"><b>🧵 Soft Fabrics</b>Gentle on delicate skin</div><div class="perk"><b>🚚 Fast Delivery</b>Straight to your door</div><div class="perk"><b>💙 Made with Love</b>Quality you can trust</div></div>`;
  },
  about(){
    const perks=[['🧵','Premium Soft Fabrics','Gentle, breathable materials chosen for delicate skin.'],['🌿','Comfort First','Easy fits that let little ones run, jump and play freely.'],['🧼','Built to Last','Durable stitching and colours that stay fresh wash after wash.'],['💰','Fair Prices','Great quality at honest prices, with regular offers.'],['🏬','Our Own Inventory','Stocked directly from our own inventory in Sialkot.'],['🎁','Careful Packing & Delivery','Every order is packed with care and sent to your door.']];
    view.innerHTML=`<section class="quote"><h1>“Because Your Little One Deserves the Best”</h1><small>— ${CONFIG.brand}</small></section>
    <section class="store"><div class="box"><h2>🏬 Our Store</h2><p>At ${CONFIG.brand}, our clothing offers a quality that is truly unmatched. Every piece is chosen with your child’s comfort, safety and style in mind, so your little one can look adorable and feel wonderful all day long.</p>
    <div class="loc">📍 <b>Our inventory is located in</b><br>Sialkot, Pakki Kotli, Daska Road</div></div>
    <div class="stat"><b>100%</b><p>Comfort, Quality &amp; Love in every stitch 💙</p></div></section>
    <div class="sec"><h2>✨ Why Parents Love ${CONFIG.brand}</h2></div>
    <div class="perks" style="margin-top:0">${perks.map(p=>`<div class="perk"><span style="font-size:36px">${p[0]}</span><b>${p[1]}</b><small style="color:var(--mute)">${p[2]}</small></div>`).join('')}</div>
    <div style="text-align:center;margin-top:36px"><a class="btn" onclick="go('winter')">Shop Winter ❄️</a><a class="btn alt" onclick="go('summer')">Shop Summer ☀️</a></div>`;
  },
  winter(){collection('winter','❄️ Winter Collection','Stay warm and stylish all season long.')},
  summer(){collection('summer','☀️ Summer Collection','Cool, comfy outfits for sunny days.')},
  cart(){
    if(!cart.length){view.innerHTML=`<h1 class="title">🛍️ Your Cart</h1><div class="empty"><p style="font-size:60px">🧺</p><p>Your cart is empty.</p><br><a class="btn" onclick="go('home')">Start Shopping</a></div>`;return}
    let sum=0;
    const rows=cart.map((c,i)=>{const p=PRODUCTS.find(x=>x.id===c.id);if(!p)return'';sum+=fin(p)*c.qty;
      return `<div class="cart-item"><div class="img">${p.image?`<img src="${p.image}" alt="">`:p.emoji}</div><div class="mid"><b>${p.name}</b><br><small>Size: ${c.size} · ${money(fin(p))}</small></div>
      <div class="qty"><button onclick="chg(${i},-1)">−</button><b>${c.qty}</b><button onclick="chg(${i},1)">+</button></div><button class="rm" onclick="rm(${i})">Remove</button></div>`}).join('');
    view.innerHTML=`<h1 class="title">🛍️ Your Cart</h1>${rows}<div class="total"><div>Total<br><b>${money(sum)}</b></div><button class="btn" onclick="checkout()">Order on WhatsApp 💬</button></div>`;
  },
  contact(){
    view.innerHTML=`<h1 class="title">Contact Us</h1><p class="sub">We’d love to hear from you!</p><div class="contact">
    <div class="box"><h3>Get in touch</h3><p>📍 ${CONFIG.address}</p><p>📞 ${CONFIG.phone}</p><p>✉️ ${CONFIG.email}</p><p>📷 ${CONFIG.instagram}</p></div>
    <div class="box"><h3>Send a message</h3><br><input class="f" id="cn" placeholder="Your name"><input class="f" id="cp" placeholder="Phone number"><textarea class="f" id="cm" rows="4" placeholder="Your message"></textarea><button class="btn" onclick="sendMsg()">Send via WhatsApp</button></div></div>`;
  }
};
function openWA(t){try{window.open('https://wa.me/'+CONFIG.whatsapp+'?text='+encodeURIComponent(t),'_blank')}catch(e){}}
function checkout(){
  let sum=0,t='Hello HM Kidora! I’d like to order:\n';
  cart.forEach(c=>{const p=PRODUCTS.find(x=>x.id===c.id);if(p){sum+=fin(p)*c.qty;t+=`• ${p.name} (${c.size}) x${c.qty} – ${money(fin(p)*c.qty)}\n`}});
  openWA(t+'Total: '+money(sum));
}
function sendMsg(){openWA(`Hi HM Kidora, I’m ${$('#cn').value} (${$('#cp').value}).\n${$('#cm').value}`)}

/* Search: every word the customer types is matched against name, description, tags, category, sizes and offers */
function search(raw){
  const words=raw.toLowerCase().split(/[\s,]+/).filter(Boolean);
  const hits=PRODUCTS.map(p=>{
    const hay=(p.name+' '+p.desc+' '+p.tags+' '+p.cat+' '+p.sizes.join(' ')+' '+(p.discount?'sale offer discount':'')).toLowerCase();
    const score=words.reduce((a,w)=>a+(hay.includes(w)?1:0),0);return{p,score};
  }).filter(h=>h.score>0).sort((a,b)=>b.score-a.score);
  view.innerHTML=`<h1 class="title">Search results</h1><p class="sub">${hits.length} item(s) for “${esc(raw)}”</p>`+
   (hits.length?`<div class="grid">${hits.map(h=>card(h.p)).join('')}</div>`:`<div class="empty"><p style="font-size:60px">🔎</p><p>Nothing found. Try words like “jacket”, “frock”, “blue” or “sale”.</p></div>`);
}
$('#q').addEventListener('input',e=>{const v=e.target.value.trim();v?search(v):route()});

function route(){
  const h=location.hash.slice(1)||'home';
  (pages[h]||pages.home)();nav();window.scrollTo(0,0);
}
window.addEventListener('hashchange',()=>{$('#q').value='';route()});

if(CONFIG.banner)$('#banner').textContent=CONFIG.banner;else $('#banner').style.display='none';
if(CONFIG.logoImage)$('#logo').innerHTML=`<img src="${CONFIG.logoImage}" alt="HM Kidora">`;
$('#yr').textContent=new Date().getFullYear();
route();
</script>
